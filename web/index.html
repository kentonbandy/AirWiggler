<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Library</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <div id="flac-warning" class="banner warning hidden">
    &#9888; Your browser does not support FLAC playback. Switch to Medium quality to listen.
  </div>

  <header>
    <div class="header-inner">
      <a id="site-title" href="#">My Music Library</a>
      <button id="back-btn" class="hidden">&#8592; Library</button>
    </div>
  </header>

  <main>
    <!-- Library View -->
    <section id="library-view">
      <div id="album-grid"></div>
    </section>

    <!-- Player View -->
    <section id="player-view" class="hidden">
      <div id="player-header">
        <img id="player-art" src="" alt="Album Art">
        <div id="player-info">
          <h2 id="player-title"></h2>
          <div id="album-actions">
            <button id="album-play-btn" title="Play album from the beginning" aria-label="Play album from the beginning">&#9654;</button>
            <div id="share-dropdown-wrap">
              <button id="album-share-btn" title="Share album" aria-label="Share album" aria-expanded="false">&#128279;</button>
              <div id="share-dropdown" class="hidden">
                <button id="share-album-only-btn">Copy album-only link</button>
                <button id="share-full-access-btn">Copy album link with full access</button>
              </div>
            </div>
            <div id="quality-selector"></div>
          </div>
        </div>
      </div>

      <div id="track-list"></div>
    </section>
  </main>

  <div id="controls" class="hidden">
    <audio id="audio"></audio>
    <div class="controls-inner">

      <div id="now-playing">
        <img id="now-playing-art" class="hidden" alt="">
        <span id="now-playing-idle">Nothing playing</span>
        <span id="track-title-display" class="hidden"></span>
      </div>

      <div id="seek-row">
        <span id="time-current">0:00</span>
        <input id="seek-bar" type="range" min="0" max="100" value="0" step="0.1">
        <span id="time-total">0:00</span>
      </div>

      <div id="control-buttons">
        <button id="prev-btn" title="Previous">&#9198;</button>
        <button id="play-btn" title="Play / Pause">&#9654;</button>
        <button id="stop-btn" title="Stop">&#9209;</button>
        <button id="next-btn" title="Next">&#9197;</button>
      </div>

      <div id="control-extras">
        <label>
          <input id="autoplay-toggle" type="checkbox" checked>
          Autoplay
        </label>
        <label id="volume-label">
          &#128266;
          <input id="volume" type="range" min="0" max="1" step="0.05" value="1">
        </label>
      </div>

    </div>
  </div>

  <div id="toast" class="hidden" role="status" aria-live="polite"></div>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden">
    <button id="lightbox-prev" class="lightbox-nav" title="Previous">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-next" class="lightbox-nav" title="Next">&#10095;</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
